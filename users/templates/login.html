{% extends "base.html" %}
{% block content %}


<div class="container mt-5">
    <form class="row" method="post" enctype="multipart/form-data">

        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-light mx-3 my-3">
                    Войти
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
