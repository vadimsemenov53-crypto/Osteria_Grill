{% extends "base.html" %}

{% block title %}Osteria Grill - Ваши бронирования.{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary mb-3">
                        Сохранить
                    </button>
                    <a class="btn btn-secondary mb-3" href="{% url 'restaurant:booking_list' %}" role="button">
                        Назад
                    </a>
                </div>
            </form>
        </div>
        <div class="col-3"></div>
    </div>
</div>

{% endblock %}
