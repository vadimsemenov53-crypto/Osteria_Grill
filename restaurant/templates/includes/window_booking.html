<div class="modal fade"
     id="bookingModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">

                <h5 class="modal-title">
                    Забронировать стол
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Закрыть"
                ></button>
            </div>

            <div class="modal-body">
                <h5 id="bookingTableNumber">
                    Стол
                </h5>

                <p id="bookingTableCapacity"
                   class="text-body-secondary">
                </p>
                <hr>
                <div class="mb-3">

                    <label for="bookingDate"
                           class="form-label">
                        Дата
                    </label>

                    <input
                        type="date"
                        id="bookingDate"
                        class="form-control">

                </div>
                <div class="mb-3">
                    <label for="bookingTime"
                           class="form-label">
                        Время
                    </label>

                    <input
                        type="time"
                        id="bookingTime"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label for="bookingGuests"
                           class="form-label">
                        Количество гостей
                    </label>
                    <input type="number" id="bookingGuests" class="form-control" min="1">
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Отмена
                </button>

                <button type="button" class="btn btn-primary">
                    Забронировать
                </button>

            </div>

        </div>

    </div>

</div>
