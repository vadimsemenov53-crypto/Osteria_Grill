<form method="post" action="" class="form-floating">
    {% csrf_token %}
    <div class="modal fade"
         id="bookingModal"
         tabindex="-1"
         aria-hidden="true"
         data-form-errors="{% if form.errors %}true{% else %}false{% endif %}"
    >

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">

                    <h5 class="modal-title">
                        Забронировать стол
                    </h5>

                    <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Закрыть"
                    ></button>
                </div>

                <div class="modal-body">
                    <h5 id="bookingTableNumber">
                        Стол
                    </h5>

                    <p id="bookingTableCapacity"
                       class="text-body-secondary">
                    </p>
                    <strong id="bookingTableCategory"></strong>
                    <hr>

                    <input
                            type="hidden"
                            name="table"
                            id="bookingTableId"
                            value="{{ selected_table_id|default:'' }}"
                    >

                    <div class="mb-3">

                        <label for="bookingDate"
                               class="form-label">
                            Дата
                        </label>

                        {% if form.booking_date.errors %}
                        <div class="text-danger mt-1">
                            {{ form.booking_date.errors }}
                        </div>
                        {% endif %}

                        <input type="date"
                               id="bookingDate"
                               name="booking_date"
                               class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="bookingTime"
                               class="form-label">
                            Время
                        </label>

                        {% if form.non_field_errors %}
                        <div class="text-danger mt-1">
                            {{ form.non_field_errors }}
                        </div>
                        {% endif %}

                        <input
                                type="time"
                                id="bookingTime"
                                name="booking_time"
                                class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="bookingGuests"
                               class="form-label">
                            Количество гостей
                        </label>

                        {% if form.guests.errors %}
                        <div class="text-danger mt-1">
                            {{ form.guests.errors|striptags }}
                        </div>
                        {% endif %}

                        <input
                                type="number"
                                id="bookingGuests"
                                name="guests"
                                class="form-control"
                                min="1">
                    </div>

                    <div class="mb-3">
                        <label for="bookingComment"
                               class="form-label">
                            Комментарий (не обязательно)
                        </label>

                        <input
                                type="text"
                                id="bookingComment"
                                name="bookingComment"
                                class="form-control">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Отмена
                    </button>

                    <button type="submit" class="btn btn-light">
                        Забронировать
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
