[project]
name = "osteria-mario"
version = "0.1.0"
description = ""
authors = [
    {name = "Vadim Semenov",email = "vadimsemenov53@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1,<7.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "django-phonenumber-field[phonenumbers] (>=8.5.0,<9.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]

[tool.black]
# Максимальная длина строки
line-length = 119
# Использование python 3.12
target-version = ["py312"]
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
# Максимальная длина строки
line_length = 119